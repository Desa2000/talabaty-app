name: talabaty_app
description: "Talabaty - طلباتي: Real-time food & delivery platform for Sudan."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  uuid: ^4.5.3
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  image_picker: ^1.2.3
  google_maps_flutter: ^2.18.0
  url_launcher: ^6.3.1
  socket_io_client: ^3.1.6
  flutter_animate: ^4.5.2
  lottie: ^3.4.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  http: ^1.6.0
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
